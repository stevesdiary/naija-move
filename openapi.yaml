        required: true
        content:
          application/json:
            example:
              tripId: "trp_01HZ9K2M3N4P5Q6R7S8T9U0V"
              email: "tunde@example.com"
              metadata:
                context: "trip_payment"
      responses:
        "200":
          description: Paystack checkout URL
          content:
            application/json:
              example:
                authorizationUrl: "https://checkout.paystack.com/0peioxfhpn"
                accessCode: "0peioxfhpn"
                reference: "NM-PAY-20260911-48213"

  /payments/verify/{reference}:
    get:
      tags: [Payments]
      summary: Verify a payment by reference
      security:
        - bearerAuth: []
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
          example: "NM-PAY-20260911-48213"
      responses:
        "200":
          description: Payment status
          content:
            application/json:
              example:
                reference: "NM-PAY-20260911-48213"
                status: "success"
                amountKobo: 185000
                channel: "card"
                paidAt: "2026-09-11T16:02:00Z"

  /payments/refund:
    post:
      tags: [Payments]
      summary: Refund a payment (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              reference: "NM-PAY-20260911-48213"
              amountKobo: 185000
      responses:
        "200":
          description: Refund initiated

  /payments/payout/driver:
    post:
      tags: [Payments]
      summary: Trigger driver payout (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              driverId: "drv_01HZ9K2M3N4P5Q6R7S8T9U0V"
              amountKobo: 500000
              settlementCycleId: "cyc_01HZ9K2M3N4P5Q6R7S8T9U0V"
      responses:
        "200":
          description: Payout created

  /payments/wallet/topup/initialize:
    post:
      tags: [Payments]
      summary: Initialize wallet top-up via Paystack
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              amountKobo: 500000
              email: "tunde@example.com"
      responses:
        "200":
          description: Paystack checkout URL
          content:
            application/json:
              example:
                authorizationUrl: "https://checkout.paystack.com/topup_0peioxfhpn"
                reference: "NM-TOPUP-20260911-00193"

  /payments/webhooks/paystack:
    post:
      tags: [Payments]
      summary: Paystack webhook receiver
      description: |
        Verified via HMAC-SHA512 signature in `x-paystack-signature` header.
        Responds 200 immediately; processes async.
        Handles `charge.success` and `transfer.success` events.
      parameters:
        - name: x-paystack-signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            example:
              event: "charge.success"
              data:
                reference: "NM-PAY-20260911-48213"
                amount: 185000
                status: "success"
                metadata:
                  context: "trip_payment"
                  tripId: "trp_01HZ9K2M3N4P5Q6R7S8T9U0V"
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              example:
                received: true

