openapi: 3.1.0
info:
  title: NaijaMove API
  version: 1.0.0
  description: |
    REST API for the NaijaMove ride-hailing platform.
    All monetary amounts are in **kobo** (1 NGN = 100 kobo).
    All timestamps are ISO 8601 UTC strings.
  contact:
    name: NaijaMove Engineering
    email: engineering@naijamove.com

servers:
  - url: http://localhost:3004
    description: Local development
  - url: https://api.naijamove.com
    description: Production

    
tags:
  - name: Health
    description: Server health
  - name: Auth
    description: OTP-based authentication
  - name: Riders
    description: Rider profile and preferences
  - name: Drivers
    description: Driver profile, availability, documents
  - name: Vehicles
    description: Vehicle registration and compliance
  - name: Rides
    description: Trip lifecycle — request, track, complete
  - name: Pricing
    description: Fare quotes and pricing configuration
  - name: Payments
    description: Paystack payments, wallet, webhooks
  - name: Wallet
    description: Wallet balance and withdrawals
  - name: Dispatch
    description: Driver dispatch and offer management
  - name: Ledger
    description: Double-entry ledger (admin)
  - name: Maps
    description: Geocoding and routing proxy
  - name: Safety
    description: SOS and incident reporting
  - name: Support
    description: Support cases and messaging
  - name: Notifications
    description: Push / SMS / WhatsApp notifications
  - name: Admin
    description: Admin operations — trips, drivers, pricing, reports

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: Unauthorized
        message:
          type: string
          example: Token expired

    Pagination:
      type: object
      properties:
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0

    Place:
      type: object
      properties:
        name:
          type: string
          example: Ikeja City Mall
        address:
          type: string
          example: Ikeja City Mall, Alausa, Ikeja, Lagos
        coordinates:
          type: object
          properties:
            lat:
              type: number
              example: 6.6018
            lng:
              type: number
              example: 3.3515

    RouteResult:
      type: object
      properties:
        distanceMeters:
          type: integer
          example: 8400
        durationSeconds:
          type: integer
          example: 1560
        polyline:
          type: string
          example: "_p~iF~ps|U_ulLnnqC_mqNvxq`@"

# ─────────────────────────────────────────────────────────────────────────────
# AUTH
# ─────────────────────────────────────────────────────────────────────────────
paths:
  #
  # Health check
  #
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              example:
                status: ok
                timestamp: "2026-09-11T16:00:00Z"

  /auth/otp/request:
    post:
      tags: [Auth]
      summary: Request OTP
      description: Sends a 6-digit OTP via SMS to the given Nigerian phone number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  pattern: '^\+234[0-9]{10}$'
                  example: "+2348025550193"
            example:
              phone: "+2348025550193"
      responses:
        "202":
          description: OTP dispatched
          content:
            application/json:
              example:
                message: OTP sent
        "400":
          description: Invalid phone number
          content:
            application/json:
              example:
                error: Bad Request
                message: Must be a valid Nigerian phone number (+234XXXXXXXXXX)

  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify OTP and obtain tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone:
                  type: string
                  example: "+2348025550193"
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
                  example: "482193"
            example:
              phone: "+2348025550193"
              code: "482193"
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              example:
                accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                refreshToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                user:
                  id: "usr_01HZ9K2M3N4P5Q6R7S8T9U0V"
                  phone: "+2348025550193"
                  role: "rider"
        "401":
          description: Invalid or expired OTP

  /auth/admin/login:
    post:
      tags: [Auth]
      summary: Admin sign-in (email + password)
      description: |
        Dashboard login for `admin` accounts. Admins cannot sign in via SMS OTP.
        Rate limited to 5 attempts/minute per IP. Unknown email and wrong password
        return the same 401. Accounts are created with `scripts/create-admin.ts`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "200":
          description: Token pair issued
          content:
            application/json:
              example:
                accessToken: "eyJhbGciOiJIUzI1NiIs..."
                refreshToken: "eyJhbGciOiJIUzI1NiIs..."
                userId: "usr_01HZ9K2M3N4P5Q6R7S8T9U0V"
                name: "Ops Lead"
        "401": { description: Invalid email or password }
        "403": { description: Not an admin account, or account disabled }
        "429": { description: Too many attempts }

  /auth/token/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
            example:
              refreshToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              example:
                accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                refreshToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (invalidate session)
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session invalidated

# ─────────────────────────────────────────────────────────────────────────────
# RIDERS
# ─────────────────────────────────────────────────────────────────────────────
  /riders/me:
    get:
      tags: [Riders]
      summary: Get my rider profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Rider profile
          content:
            application/json:
              example:
                id: "rdr_01HZ9K2M3N4P5Q6R7S8T9U0V"
                userId: "usr_01HZ9K2M3N4P5Q6R7S8T9U0V"
                name: "Tunde Bakare"
                phone: "+2348025550193"
                email: "tunde@example.com"
                rating: 4.9
                totalTrips: 42
                preferredPaymentMethod: "card"
                createdAt: "2024-01-15T10:30:00Z"
    put:
      tags: [Riders]
      summary: Update my rider profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Tunde Bakare"
                email:
                  type: string
                  format: email
                  example: "tunde@example.com"
                preferredPaymentMethod:
                  type: string
                  example: "card"
            example:
              name: "Tunde Bakare"
              email: "tunde@example.com"
              preferredPaymentMethod: "card"
      responses:
        "200":
          description: Updated profile

  /riders/me/saved-places:
    get:
      tags: [Riders]
      summary: List saved places
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Saved places list
          content:
            application/json:
              example:
                places:
                  - id: "plc_01HZ9K2M3N4P5Q6R7S8T9U0V"
                    label: "home"
                    name: "24 Adetokunbo Ademola St"
                    address: "24 Adetokunbo Ademola St, Victoria Island, Lagos"
                    lat: 6.4281
                    lng: 3.4219
                  - id: "plc_02HZ9K2M3N4P5Q6R7S8T9U0V"
                    label: "work"
                    name: "Ikeja City Mall"
                    address: "Ikeja City Mall, Alausa, Ikeja, Lagos"
                    lat: 6.6018
                    lng: 3.3515
    post:
      tags: [Riders]
      summary: Add a saved place
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, name, address, lat, lng]
              properties:
                label:
                  type: string
                  enum: [home, work, other]
                name:
                  type: string
                address:
                  type: string
                lat:
                  type: number
                lng:
                  type: number
            example:
              label: "home"
              name: "24 Adetokunbo Ademola St"
              address: "24 Adetokunbo Ademola St, Victoria Island, Lagos"
              lat: 6.4281
              lng: 3.4219
      responses:
        "200":
          description: Saved place created

  /riders/me/saved-places/{placeId}:
    delete:
      tags: [Riders]
      summary: Remove a saved place
      security:
        - bearerAuth: []
      parameters:
        - name: placeId
          in: path
          required: true
          schema:
            type: string
          example: "plc_01HZ9K2M3N4P5Q6R7S8T9U0V"
      responses:
        "200":
          description: Removed
          content:
            application/json:
              example:
                message: Saved place removed

  /riders/me/emergency-contacts:
    get:
      tags: [Riders]
      summary: List emergency contacts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Emergency contacts
          content:
            application/json:
              example:
                contacts:
                  - id: "ec_01HZ9K2M3N4P5Q6R7S8T9U0V"
                    name: "Ngozi Bakare"
                    phone: "+2348037712244"
                    shareTrips: true
    post:
      tags: [Riders]
      summary: Add emergency contact
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone]
              properties:
                name:
                  type: string
                phone:
                  type: string
                  pattern: '^\+234[0-9]{10}$'
                shareTrips:
                  type: boolean
            example:
              name: "Ngozi Bakare"
              phone: "+2348037712244"
              shareTrips: true
      responses:
        "200":
          description: Contact added

  /riders/me/emergency-contacts/{contactId}:
    delete:
      tags: [Riders]
      summary: Remove emergency contact
      security:
        - bearerAuth: []
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
          content:
            application/json:
              example:
                message: Emergency contact removed

# ─────────────────────────────────────────────────────────────────────────────
# DRIVERS
# ─────────────────────────────────────────────────────────────────────────────
  /drivers/register:
    post:
      tags: [Drivers]
      summary: Register as a driver
      description: |
        Called by a signed-in **rider**. Creates a `pending` driver profile, switches the
        account role to `driver`, and returns a fresh token pair carrying that role —
        replace the stored tokens with these. Admin approval is still required before
        the driver can go online.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Driver profile created and role upgraded
          content:
            application/json:
              example:
                driver:
                  id: "drv_01HZ9K2M3N4P5Q6R7S8T9U0V"
                  userId: "usr_01HZ9K2M3N4P5Q6R7S8T9U0V"
                  status: "pending"
                  createdAt: "2024-01-15T10:30:00Z"
                accessToken: "eyJhbGciOiJIUzI1NiIs..."
                refreshToken: "eyJhbGciOiJIUzI1NiIs..."
        "403": { description: Caller is not a rider }
        "409": { description: Driver profile already exists }

  /drivers/me:
    get:
      tags: [Drivers]
      summary: Get my driver profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Driver profile
          content:
            application/json:
              example:
                id: "drv_01HZ9K2M3N4P5Q6R7S8T9U0V"
                name: "Emeka Okafor"
                phone: "+2348025550193"
                rating: 4.87
                totalTrips: 1240
                status: "approved"
                isOnline: true
                tier: "gold"
                acceptanceRate: 94
                completionRate: 98

  /drivers/availability:
    post:
      tags: [Drivers]
      summary: Set online / offline status
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isOnline]
              properties:
                isOnline:
                  type: boolean
            example:
              isOnline: true
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              example:
                isOnline: true
                updatedAt: "2026-09-11T16:00:00Z"

  /drivers/location:
    post:
      tags: [Drivers]
      summary: Update driver GPS location
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat:
                  type: number
                  minimum: -90
                  maximum: 90
                lng:
                  type: number
                  minimum: -180
                  maximum: 180
            example:
              lat: 6.4281
              lng: 3.4219
      responses:
        "200":
          description: Location updated

  /drivers/earnings:
    get:
      tags: [Drivers]
      summary: Get driver earnings summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Earnings breakdown
          content:
            application/json:
              example:
                today:
                  tripsCompleted: 7
                  grossKobo: 620000
                  commissionKobo: 124000
                  netKobo: 496000
                week:
                  tripsCompleted: 34
                  grossKobo: 3460000
                  commissionKobo: 692000
                  bonusKobo: 200000
                  netKobo: 2968000
                walletBalanceKobo: 1260000

  /drivers/documents:
    get:
      tags: [Drivers]
      summary: List my documents
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Document list
          content:
            application/json:
              example:
                documents:
                  - id: "doc_01HZ9K2M3N4P5Q6R7S8T9U0V"
                    type: "drivers_licence"
                    status: "verified"
                    expiresAt: "2028-06-02T00:00:00Z"
                  - id: "doc_02HZ9K2M3N4P5Q6R7S8T9U0V"
                    type: "insurance"
                    status: "expiring_soon"
                    expiresAt: "2026-09-25T00:00:00Z"
    post:
      tags: [Drivers]
      summary: Upload a document
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [drivers_licence, vehicle_registration, insurance, inspection, background_check, profile_photo]
                fileUrl:
                  type: string
                  format: uri
                referenceNumber:
                  type: string
                expiresAt:
                  type: string
                  format: date-time
            example:
              type: "drivers_licence"
              fileUrl: "https://storage.naijamove.com/docs/licence-emeka.jpg"
              referenceNumber: "LIC-2024-00482"
              expiresAt: "2028-06-02T00:00:00Z"
      responses:
        "200":
          description: Document uploaded

  /drivers/{driverId}/approve:
    post:
      tags: [Drivers]
      summary: Approve a driver (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
          example: "drv_01HZ9K2M3N4P5Q6R7S8T9U0V"
      responses:
        "200":
          description: Driver approved
          content:
            application/json:
              example:
                id: "drv_01HZ9K2M3N4P5Q6R7S8T9U0V"
                status: "approved"

  /drivers/{driverId}/suspend:
    post:
      tags: [Drivers]
      summary: Suspend a driver (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
            example:
              reason: "Multiple rider complaints about unsafe driving"
      responses:
        "200":
          description: Driver suspended

# ─────────────────────────────────────────────────────────────────────────────
# VEHICLES
# ─────────────────────────────────────────────────────────────────────────────
  /vehicles:
    get:
      tags: [Vehicles]
      summary: List my vehicles
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Vehicle list
          content:
            application/json:
              example:
                vehicles:
                  - id: "veh_01HZ9K2M3N4P5Q6R7S8T9U0V"
                    plate: "LND 482 KJ"
                    make: "Toyota"
                    model: "Corolla"
                    year: 2019
                    color: "White"
                    category: "economy"
                    seats: 4
                    isActive: true
    post:
      tags: [Vehicles]
      summary: Register a vehicle
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plate, make, model, year, color, category, seats]
              properties:
                plate:
                  type: string
                  example: "LND 482 KJ"
                make:
                  type: string
                  example: "Toyota"
                model:
                  type: string
                  example: "Corolla"
                year:
                  type: integer
                  example: 2019
                color:
                  type: string
                  example: "White"
                category:
                  type: string
                  enum: [economy, comfort, premium, xl]
                seats:
                  type: integer
                  example: 4
            example:
              plate: "LND 482 KJ"
              make: "Toyota"
              model: "Corolla"
              year: 2019
              color: "White"
              category: "economy"
              seats: 4
      responses:
        "200":
          description: Vehicle registered

  /vehicles/{vehicleId}:
    get:
      tags: [Vehicles]
      summary: Get a vehicle
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Vehicle detail
    put:
      tags: [Vehicles]
      summary: Update a vehicle
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            example:
              color: "Silver"
              isActive: true
      responses:
        "200":
          description: Updated
    delete:
      tags: [Vehicles]
      summary: Remove a vehicle
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
          content:
            application/json:
              example:
                message: Vehicle removed

  /vehicles/{vehicleId}/inspections:
    get:
      tags: [Vehicles]
      summary: List vehicle inspections
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Inspections
          content:
            application/json:
              example:
                inspections:
                  - id: "ins_01HZ9K2M3N4P5Q6R7S8T9U0V"
                    status: "passed"
                    result: "All systems nominal"
                    inspectedAt: "2026-01-10T09:00:00Z"
                    expiresAt: "2027-01-10T09:00:00Z"
    post:
      tags: [Vehicles]
      summary: Request an inspection (driver)
      description: |
        Creates an inspection record in `pending` state. Drivers cannot set the
        outcome — an admin records pass/fail via `PUT /vehicles/{vehicleId}/inspections/{inspectionId}`.
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            example:
              result: "Booked at Ikeja centre"
              inspectedAt: "2026-01-10T09:00:00Z"
      responses:
        "200":
          description: Inspection request recorded (status `pending`)

  /vehicles/{vehicleId}/inspections/{inspectionId}:
    put:
      tags: [Vehicles]
      summary: Record inspection outcome (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema: { type: string }
        - name: inspectionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [passed, failed] }
                result: { type: string, maxLength: 500 }
                expiresAt: { type: string, format: date-time }
            example:
              status: "passed"
              result: "All systems nominal"
              expiresAt: "2027-01-10T09:00:00Z"
      responses:
        "200":
          description: Inspection updated
        "403":
          description: Admin only
        "404":
          description: Inspection not found for this vehicle

  /vehicles/{vehicleId}/insurance:
    get:
      tags: [Vehicles]
      summary: List vehicle insurance records
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Insurance records
    post:
      tags: [Vehicles]
      summary: Add insurance record
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            example:
              provider: "AXA Mansard"
              policyNumber: "AXA-2026-00482193"
              expiresAt: "2027-09-11T00:00:00Z"
              documentUrl: "https://storage.naijamove.com/docs/insurance-lnd482kj.pdf"
      responses:
        "200":
          description: Insurance added

# ─────────────────────────────────────────────────────────────────────────────
# PRICING
# ─────────────────────────────────────────────────────────────────────────────
  /pricing/quote:
    post:
      tags: [Pricing]
      summary: Get a fare quote
      description: |
        Returns a fare quote for a given route. Distance and duration are
        computed server-side from the coordinates (client-supplied values are
        ignored). The returned `quoteId` must be passed when creating a trip,
        and the trip's pickup/destination must match the quoted ones.
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [city, category, pickupLat, pickupLng, destinationLat, destinationLng]
              properties:
                city:
                  type: string
                  example: "Lagos"
                category:
                  type: string
