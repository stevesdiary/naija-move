  /rides:
    post:
      tags: [Rides]
      summary: Request a trip (rider)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickupAddress, pickupLat, pickupLng, destinationAddress, destinationLat, destinationLng, paymentMethod, quoteId]
              properties:
                pickupAddress:
                  type: string
                pickupLat:
                  type: number
                pickupLng:
                  type: number
                destinationAddress:
                  type: string
                destinationLat:
                  type: number
                destinationLng:
                  type: number
                paymentMethod:
                  type: string
                  enum: [card, wallet, cash, bank_transfer, corporate_wallet]
                quoteId:
                  type: string
                  format: uuid
                mode:
                  type: string
                  enum: [immediate, scheduled]
                  default: immediate
                scheduledFor:
                  type: string
                  format: date-time
            example:
              pickupAddress: "24 Adetokunbo Ademola St, Victoria Island"
              pickupLat: 6.4281
              pickupLng: 3.4219
              destinationAddress: "Ikeja City Mall, Alausa, Ikeja"
              destinationLat: 6.6018
              destinationLng: 3.3515
              paymentMethod: "card"
              quoteId: "qte_01HZ9K2M3N4P5Q6R7S8T9U0V"
              mode: "immediate"
      responses:
        "200":
          description: Trip created and dispatch started
          content:
            application/json:
              example:
                id: "trp_01HZ9K2M3N4P5Q6R7S8T9U0V"
                status: "searching"
                pin: "4821"
                fareKobo: 185000
                pickupAddress: "24 Adetokunbo Ademola St, Victoria Island"
                destinationAddress: "Ikeja City Mall, Alausa, Ikeja"
                createdAt: "2026-09-11T16:00:00Z"

